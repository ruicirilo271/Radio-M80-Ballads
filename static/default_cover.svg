<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#4a2f11"/>
      <stop offset=".48" stop-color="#171008"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b2"/>
      <stop offset=".45" stop-color="#e9ad3d"/>
      <stop offset="1" stop-color="#87520f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <circle cx="450" cy="450" r="320" fill="none" stroke="#f3bd52" stroke-opacity=".13" stroke-width="2"/>
