  <circle cx="450" cy="450" r="155" fill="none" stroke="#f7d57b" stroke-opacity=".15" stroke-width="2"/>
  <circle cx="450" cy="450" r="100" fill="url(#gold)" filter="url(#glow)" opacity=".95"/>
  <circle cx="450" cy="450" r="15" fill="#120c05"/>
  <text x="450" y="430" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="128" font-weight="700">M80</text>
  <text x="450" y="520" text-anchor="middle" fill="#f9df9a" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="18">BALLADS</text>
  <text x="450" y="690" text-anchor="middle" fill="#9f824d" font-family="Arial, sans-serif" font-size="19" letter-spacing="9">RÁDIO NEON GOLD</text>
